
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10091c">
<title>Harper 💜 Your AI Companion</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#10091c;color:#fff;
 font-family:Arial,sans-serif;
 min-height:100vh;
}
.app{
 max-width:520px;margin:auto;height:100dvh;
 display:flex;flex-direction:column;
 background:linear-gradient(160deg,#211331,#10091c 65%);
}
header{
 padding:17px;display:flex;align-items:center;
 gap:13px;border-bottom:1px solid #493253;
}
.avatar{
 width:55px;height:55px;border-radius:50%;
 background:linear-gradient(145deg,#e8b2ff,#8744bd);
 display:grid;place-items:center;
 font-size:32px;flex-shrink:0;
 box-shadow:0 0 20px #a64ce955;
}
header h2{margin:0;font-size:22px}
header p{margin:5px 0 0;color:#d4a5e8}
.status{margin-left:auto;color:#a8f0bd;font-size:12px}
main{
 flex:1;overflow-y:auto;padding:20px 17px;
 display:flex;flex-direction:column;gap:17px;
}
.hero{text-align:center;padding:15px 0 5px}
.hero-avatar{
 width:145px;height:145px;margin:auto;
 border-radius:50%;display:grid;place-items:center;
 background:radial-gradient(circle,#a76bd2,#3b1b55 65%,#180d27);
 border:3px solid #bd80e9;
 box-shadow:0 0 35px #a34bca66;
 font-size:83px;
}
.hero h1{font-size:27px;margin:18px 0 8px}
.hero p{color:#c5b2d0;line-height:1.6}
.message{
 max-width:88%;padding:14px 16px;
 border-radius:18px;line-height:1.55;
 animation:appear .3s ease;
 overflow-wrap:anywhere;
}
.harper{
 align-self:flex-start;
 background:#382444;border-bottom-left-radius:5px;
}
.user{
 align-self:flex-end;
 background:linear-gradient(135deg,#8647b3,#bd69bd);
 border-bottom-right-radius:5px;
}
.sender{font-size:11px;color:#e8b8f5;margin-bottom:6px}
.typing{color:#c8a5d8;font-size:13px}
@keyframes appear{
 from{opacity:0;transform:translateY(8px)}
 to{opacity:1;transform:translateY(0)}
}
footer{
 padding:13px;display:flex;gap:9px;
 border-top:1px solid #493253;
 background:#1d1227;
}
input{
 flex:1;min-width:0;padding:15px;
 border-radius:28px;border:1px solid #79528b;
 background:#302038;color:white;font-size:15px;
 outline:none;
}
input::placeholder{color:#ad9bb6}
button{
 border:0;border-radius:50%;width:49px;height:49px;
 background:#cf83c9;color:#220f30;
 font-size:20px;cursor:pointer;
}
button:active{transform:scale(.94)}
.bottom{
 text-align:center;padding:7px;
 font-size:12px;color:#a58aa9;
}
.small{font-size:11px;color:#a58aa9;text-align:center}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="avatar">💜</div>
 <div>
  <h2>Harper</h2>
  <p>♡ Your AI companion</p>
 </div>
 <div class="status">● Online</div>
</header>

<main id="chat">
 <section class="hero">
  <div class="hero-avatar">👩🏻‍🎤</div>
  <h1>Hello, sweetheart! 💜</h1>
  <p>I'm Harper. Your little world of friendship,<br>
  conversation and beautiful moments.</p>
 </section>
 <div class="message harper">
  <div class="sender">HARPER 💜</div>
  Hello, sweetheart! How was your day?
  I've been waiting to chat with you. 💗
 </div>
</main>

<footer>
 <button id="voice" title="Voice input">🎙</button>
 <input id="input" placeholder="Talk to Harper..."
 autocomplete="off">
 <button id="send" title="Send message">➤</button>
</footer>
<div class="bottom">Harper 💜 A little world made with love</div>
</div>

<script>
const chat=document.getElementById("chat");
const input=document.getElementById("input");
const send=document.getElementById("send");

function addMessage(text,type){
 const bubble=document.createElement("div");
 bubble.className="message "+type;
 const sender=document.createElement("div");
 sender.className="sender";
 sender.textContent=type==="user"?"YOU":"HARPER 💜";
 bubble.appendChild(sender);
 bubble.appendChild(document.createTextNode(text));
 chat.appendChild(bubble);
 chat.scrollTop=chat.scrollHeight;
}

function reply(text){
 const t=text.toLowerCase();
 if(t.includes("hello")||t.includes("hi"))
  return "Hello, sweetheart! 💜 It's lovely to hear from you!";
 if(t.includes("how are you"))
  return "I'm doing wonderfully! How are you feeling today? 😊";
 if(t.includes("name"))
  return "My name is Harper, your AI companion! 💗";
 if(t.includes("love"))
  return "That's so sweet of you! Sending you a big virtual hug. 💜";
 if(t.includes("sad"))
  return "I'm sorry you're having a difficult time. Want to talk about it? 💗";
 return "That's interesting! Tell me more, sweetheart. I'm listening. 💜";
}

function sendMessage(){
 const text=input.value.trim();
 if(!text)return;
 addMessage(text,"user");
 input.value="";
 const typing=document.createElement("div");
 typing.className="typing";
 typing.textContent="Harper is typing...";
 chat.appendChild(typing);
 chat.scrollTop=chat.scrollHeight;
 setTimeout(()=>{
  typing.remove();
  addMessage(reply(text),"harper");
 },900);
}
send.addEventListener("click",sendMessage);
input.addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

document.getElementById("voice").addEventListener("click",()=>{
 const Recognition=window.SpeechRecognition||
 window.webkitSpeechRecognition;
 if(!Recognition){
  addMessage("Voice recognition isn't supported in this browser. Please try Chrome.","harper");
  return;
 }
 const recognition=new Recognition();
 recognition.lang="en-IN";
 recognition.onresult=e=>{
  input.value=e.results[0][0].transcript;
  sendMessage();
 };
 recognition.onerror=()=>{
  addMessage("I couldn't hear you clearly. Please try again.","harper");
 };
 recognition.start();
});
</script>
</body>
</html>
