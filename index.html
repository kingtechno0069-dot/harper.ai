
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#17111f">
<title>Harper ❤️</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#17111f;color:#fff;
 font-family:Arial,sans-serif;height:100vh;
 display:flex;justify-content:center;
}
.app{width:100%;max-width:500px;display:flex;
 flex-direction:column;height:100dvh;
 background:linear-gradient(160deg,#25192e,#17111f 65%);
}
header{padding:22px 18px;border-bottom:1px solid #49354e;
 display:flex;align-items:center;gap:13px}
.avatar{width:48px;height:48px;border-radius:50%;
 background:linear-gradient(135deg,#f3b6d4,#a77bd6);
 display:grid;place-items:center;font-size:25px}
header h2{margin:0;font-size:21px}
header small{color:#e6a8cb}
.chat{flex:1;overflow-y:auto;padding:20px 15px}
.welcome{text-align:center;margin:35px 0}
.heart{font-size:48px}
.welcome h1{font-size:27px;margin:10px}
.welcome p{color:#c9b8ce;line-height:1.5}
.message{padding:13px 16px;border-radius:18px;
 margin:12px 0;max-width:85%;line-height:1.5;
 overflow-wrap:anywhere}
.harper{background:#392944;border-bottom-left-radius:4px}
.user{background:#965b91;margin-left:auto;
 border-bottom-right-radius:4px}
.label{font-size:11px;color:#d8b9d9;margin-bottom:5px}
.composer{padding:13px;display:flex;gap:9px;
 border-top:1px solid #49354e;background:#211829}
input{min-width:0;flex:1;border:1px solid #60496a;
 background:#302337;color:white;border-radius:25px;
 padding:14px;font-size:15px;outline:none}
button{border:0;background:#d88bbd;color:#251529;
 border-radius:50%;width:48px;height:48px;
 font-size:20px;cursor:pointer}
footer{text-align:center;color:#9c879f;
 font-size:11px;padding:0 10px 10px}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="avatar">❤️</div>
 <div>
  <h2>Harper</h2>
  <small>♡ Your AI companion</small>
 </div>
</header>

<main class="chat" id="chat">
 <div class="welcome">
  <div class="heart">💕</div>
  <h1>Hello, I'm Harper!</h1>
  <p>I'm happy you're here.<br>
  Let's make some beautiful memories together.</p>
 </div>
 <div class="message harper">
  <div class="label">HARPER ❤️</div>
  Hello, sweetheart! How was your day?
  I've been waiting to chat with you. 💗
 </div>
</main>

<div class="composer">
 <input id="message" placeholder="Talk to Harper..."
 autocomplete="off">
 <button onclick="sendMessage()" aria-label="Send">➤</button>
</div>
<footer>Harper ❤️ A little world made with love</footer>
</div>

<script>
function sendMessage(){
 const input=document.getElementById('message');
 const chat=document.getElementById('chat');
 const value=input.value.trim();
 if(!value)return;

 const user=document.createElement('div');
 user.className='message user';
 user.textContent=value;
 chat.appendChild(user);
 input.value='';

 const reply=document.createElement('div');
 reply.className='message harper';
 reply.textContent="I'm glad you're sharing that with me. ❤️ Tell me more, sweetheart.";
 chat.appendChild(reply);
 chat.scrollTop=chat.scrollHeight;
}
document.getElementById('message').addEventListener('keydown',e=>{
 if(e.key==='Enter')sendMessage();
});
</script>
</body>
</html>
