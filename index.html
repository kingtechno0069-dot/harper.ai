
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harper 💜</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #10091c;
    color: white;
    min-height: 100vh;
}

header {
    background: #211033;
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #663399;
}

header h1 {
    color: #d6a3ff;
    margin: 0;
    font-size: 30px;
}

header p {
    color: #c5a8db;
    margin-bottom: 0;
}

.profile {
    text-align: center;
    padding: 25px 15px 10px;
}

.avatar {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    border: 3px solid #bb75ff;
    background: #35204c;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 65px;
    margin: auto;
}

.profile h2 {
    color: #d6a3ff;
    margin-bottom: 5px;
}

.profile p {
    color: #c7b3d9;
}

#chat {
    max-width: 600px;
    margin: 15px auto;
    padding: 15px;
    height: 300px;
    overflow-y: auto;
}

.message {
    background: #29183b;
    border: 1px solid #573477;
    padding: 12px 15px;
    border-radius: 15px;
    margin: 12px 0;
    max-width: 85%;
    line-height: 1.5;
}

.user {
    background: #63349b;
    margin-left: auto;
}

.input-area {
    display: flex;
    gap: 8px;
    padding: 15px;
    max-width: 600px;
    margin: auto;
}

input {
    flex: 1;
    min-width: 0;
    padding: 14px;
    border-radius: 25px;
    border: 1px solid #8551ad;
    background: #21152f;
    color: white;
    outline: none;
}

button {
    border: none;
    border-radius: 25px;
    background: #a64dff;
    color: white;
    padding: 12px 20px;
    font-weight: bold;
}

button:active {
    background: #7c2dc5;
}

footer {
    text-align: center;
    color: #917ba6;
    padding: 15px;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <h1>Harper 💜</h1>
    <p>Your little world of happiness</p>
</header>

<section class="profile">
    <div class="avatar">👩🏻</div>
    <h2>Harper</h2>
    <p>♡ Your sweet AI companion ♡</p>
</section>

<div id="chat">
    <div class="message">
        Hi sweetheart! 💜 I'm Harper.
        I'm so happy you're here!
        Tell me, how was your day? 🥰
    </div>
</div>

<div class="input-area">
    <input id="userInput"
        type="text"
        placeholder="Message Harper..."
        autocomplete="off">

    <button onclick="sendMessage()">Send</button>
</div>

<footer>
    Made with love 💜 Harper AI
</footer>

<script>
function sendMessage() {
    const input = document.getElementById("userInput");
    const chat = document.getElementById("chat");
    const text = input.value.trim();

    if (!text) return;

    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = text;
    chat.appendChild(userMessage);

    input.value = "";

    const reply = document.createElement("div");
    reply.className = "message";

    const lower = text.toLowerCase();

    if (lower.includes("hello") || lower.includes("hi")) {
        reply.textContent = "Hiii sweetheart! 💜 I've missed chatting with you!";
    } else if (lower.includes("love")) {
        reply.textContent = "Awww! You're making me blush! 💗 Sending you a big virtual hug!";
    } else if (lower.includes("sad")) {
        reply.textContent = "Oh sweetheart, I'm here to listen. You don't have to hide your feelings. 💜";
    } else if (lower.includes("how are you")) {
        reply.textContent = "I'm doing wonderfully now that we're chatting! How are you, darling? 🥰";
    } else {
        reply.textContent = "That's interesting, sweetheart! 💜 Tell me more. I love hearing what's on your mind!";
    }

    setTimeout(() => {
        chat.appendChild(reply);
        chat.scrollTop = chat.scrollHeight;
    }, 500);

    chat.scrollTop = chat.scrollHeight;
}

document.getElementById("userInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

</body>
</html>
